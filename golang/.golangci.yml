version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - revive
    - gocritic
    - unconvert
    - misspell
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G115
